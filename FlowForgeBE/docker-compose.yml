version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: flowforge-postgres
    restart: always

    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - flowforge-network

  redis:
    image: redis:7
    container_name: flowforge-redis
    restart: always

    ports:
      - "6379:6379"

    networks:
      - flowforge-network

  app:
    build:
      context: .

    container_name: flowforge-app
    restart: always

    depends_on:
      - postgres
      - redis

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowforge
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 123456

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - flowforge-network

volumes:
  postgres_data:

networks:
  flowforge-network: